<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">String_Vext: two computations from one triclinic structure</title>
  <desc id="desc">A triclinic periodic framework and two-site guest feed a GPU String pathway solver and an exact CPU 64-orientation Vext field generator.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c6cfc8" opacity="0.55"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#e9f0eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="26" fill="url(#paper)"/>
  <rect width="1200" height="500" rx="26" fill="url(#dots)"/>
  <path d="M0 366 C240 305 392 469 620 421 S1006 316 1200 386 L1200 500 L0 500 Z" fill="#dbe9df" opacity="0.64"/>
  <path d="M0 426 C258 360 395 492 633 448 S1020 374 1200 423" fill="none" stroke="#9abcae" stroke-width="2" opacity="0.55"/>

  <g transform="translate(54 57)">
    <path d="M0 56 L69 23 L132 51 L63 84 Z M0 56 L0 131 L63 160 L63 84 M63 84 L132 51 L132 126 L63 160 M0 131 L69 98 L132 126 M69 23 L69 98" fill="none" stroke="#0c6f67" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="73" r="7" fill="#e18742"/>
    <circle cx="90" cy="105" r="7" fill="#e18742"/>
    <circle cx="109" cy="67" r="5" fill="#1d3430"/>
    <circle cx="22" cy="111" r="5" fill="#1d3430"/>
    <path d="M40 73 L90 105" stroke="#e18742" stroke-width="3" opacity="0.8"/>
  </g>

  <text x="238" y="103" fill="#18352f" font-family="Georgia, serif" font-weight="700" font-size="70" letter-spacing="-2">String</text>
  <text x="454" y="103" fill="#e18742" font-family="Georgia, serif" font-weight="700" font-size="70">/</text>
  <text x="494" y="103" fill="#18352f" font-family="Georgia, serif" font-weight="700" font-size="70" letter-spacing="-2">Vext</text>
  <text x="242" y="145" fill="#49655c" font-family="Arial, sans-serif" font-size="24" letter-spacing="1.2">ONE TRICLINIC INPUT. TWO PHYSICAL VIEWS.</text>

  <g font-family="Arial, sans-serif">
    <rect x="67" y="220" width="280" height="138" rx="15" fill="#fffdf8" stroke="#bfd0c5" stroke-width="2"/>
    <rect x="67" y="220" width="8" height="138" rx="4" fill="#0c6f67"/>
    <text x="93" y="255" fill="#153b34" font-size="23" font-weight="700">PERIODIC INPUT</text>
    <text x="93" y="288" fill="#47655b" font-size="18">a, b, c + alpha, beta, gamma</text>
    <text x="93" y="316" fill="#47655b" font-size="18">fractional atoms + LJ sites</text>
    <text x="93" y="342" fill="#0c6f67" font-size="16" font-weight="700">No orthogonalization</text>

    <path d="M347 289 H419 M419 289 L438 240 M419 289 L438 338" fill="none" stroke="#708f81" stroke-width="3" stroke-linecap="round"/>
    <circle cx="419" cy="289" r="5" fill="#708f81"/>

    <rect x="438" y="202" width="292" height="97" rx="15" fill="#173a36"/>
    <text x="462" y="239" fill="#f7f4e8" font-size="24" font-weight="700">GPU STRING</text>
    <text x="462" y="269" fill="#b7d7c7" font-size="17">continuous path + barrier</text>

    <rect x="438" y="317" width="292" height="97" rx="15" fill="#f0d9bf" stroke="#dbb284" stroke-width="1.5"/>
    <text x="462" y="354" fill="#513721" font-size="24" font-weight="700">CPU VEXT</text>
    <text x="462" y="384" fill="#765037" font-size="17">exact 60^3 x 64 field</text>

    <path d="M730 250 H793 M730 366 H793" stroke="#708f81" stroke-width="3" stroke-linecap="round"/>
    <path d="M793 250 L784 244 M793 250 L784 256 M793 366 L784 360 M793 366 L784 372" fill="none" stroke="#708f81" stroke-width="3" stroke-linecap="round"/>

    <rect x="802" y="220" width="330" height="167" rx="15" fill="#fffdf8" stroke="#bfd0c5" stroke-width="2"/>
    <text x="829" y="257" fill="#153b34" font-size="23" font-weight="700">TRANSPORT OUTPUTS</text>
    <path d="M832 291 C862 317 889 276 919 295 S973 309 1007 268 S1068 315 1100 282" fill="none" stroke="#e18742" stroke-width="4" stroke-linecap="round"/>
    <path d="M832 339 C875 338 887 335 920 338 S986 344 1022 339 S1070 332 1100 336" fill="none" stroke="#0c6f67" stroke-width="4" stroke-linecap="round"/>
    <text x="831" y="371" fill="#587167" font-size="15">PATH ENERGY  /  ORIENTATION LANDSCAPE</text>
  </g>
</svg>
